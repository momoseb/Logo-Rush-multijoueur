openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Logo Rush game API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: game
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /game/stats:
    get:
      operationId: getGameStats
      tags: [game]
      summary: Live platform activity
      responses:
        "200":
          description: Current activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameStats"
  /game/rooms:
    get:
      operationId: listPublicRooms
      tags: [game]
      summary: Public rooms currently accepting players
      responses:
        "200":
          description: Public rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicRoom"
  /game/logos:
    get:
      operationId: listSoloLogos
      tags: [game]
      summary: Demonstration logo set for solo games
      responses:
        "200":
          description: Logos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Logo"
  /game/solo-leaderboard:
    get:
      operationId: getSoloLeaderboard
      tags: [game]
      summary: Top five solo scores for one game mode
      parameters:
        - name: roundCount
          in: query
          required: true
          schema:
            type: integer
            enum: [5, 10, 15, 20]
        - name: roundDuration
          in: query
          required: true
          schema:
            type: integer
            enum: [15, 20, 30]
      responses:
        "200":
          description: Best scores for this mode
          content:
            application/json:
              schema:
                type: array
                maxItems: 5
                items:
                  $ref: "#/components/schemas/SoloLeaderboardEntry"
    post:
      operationId: submitSoloScore
      tags: [game]
      summary: Save a completed solo game score
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SoloScoreInput"
      responses:
        "201":
          description: Updated leaderboard for this mode
          content:
            application/json:
              schema:
                type: array
                maxItems: 5
                items:
                  $ref: "#/components/schemas/SoloLeaderboardEntry"
  /game/logo-reports:
    post:
      operationId: reportLogo
      tags: [game]
      summary: Flag a logo as unrecognizable or incorrect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoReportInput"
      responses:
        "201":
          description: Report recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoReportResult"
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
    GameStats:
      type: object
      required: [playersOnline, publicRooms, gamesInProgress]
      properties:
        playersOnline:
          type: integer
        publicRooms:
          type: integer
        gamesInProgress:
          type: integer
    PublicRoom:
      type: object
      required: [code, name, hostName, playerCount, maxPlayers, roundCount, roundDuration, status]
      properties:
        code:
          type: string
        name:
          type: string
        hostName:
          type: string
        playerCount:
          type: integer
        maxPlayers:
          type: integer
        roundCount:
          type: integer
        roundDuration:
          type: integer
        status:
          type: string
          enum: [waiting, playing]
    Logo:
      type: object
      required: [id, answer, aliases, category, difficulty, imageUrl]
      properties:
        id:
          type: string
        answer:
          type: string
        aliases:
          type: array
          items:
            type: string
        category:
          type: string
        difficulty:
          type: string
          enum: [easy, medium, hard]
        imageUrl:
          type: string
    SoloLeaderboardEntry:
      type: object
      required: [id, nickname, score, roundCount, roundDuration, createdAt]
      properties:
        id:
          type: integer
        nickname:
          type: string
        score:
          type: integer
        roundCount:
          type: integer
        roundDuration:
          type: integer
        createdAt:
          type: string
          format: date-time
    SoloScoreInput:
      type: object
      required: [nickname, score, roundCount, roundDuration]
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 20
        score:
          type: integer
          minimum: 0
          maximum: 20000
        roundCount:
          type: integer
          enum: [5, 10, 15, 20]
        roundDuration:
          type: integer
          enum: [15, 20, 30]
    LogoReportInput:
      type: object
      required: [logoId, reason]
      properties:
        logoId:
          type: string
          minLength: 1
          maxLength: 64
        reason:
          type: string
          enum: [unknown, incorrect, other]
    LogoReportResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
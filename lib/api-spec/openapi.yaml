openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Logo Rush game API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: game
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /game/stats:
    get:
      operationId: getGameStats
      tags: [game]
      summary: Live platform activity
      responses:
        "200":
          description: Current activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameStats"
  /game/rooms:
    get:
      operationId: listPublicRooms
      tags: [game]
      summary: Public rooms currently accepting players
      responses:
        "200":
          description: Public rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicRoom"
  /game/logos:
    get:
      operationId: listSoloLogos
      tags: [game]
      summary: Demonstration logo set for solo games
      responses:
        "200":
          description: Logos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Logo"
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
    GameStats:
      type: object
      required: [playersOnline, publicRooms, gamesInProgress]
      properties:
        playersOnline:
          type: integer
        publicRooms:
          type: integer
        gamesInProgress:
          type: integer
    PublicRoom:
      type: object
      required: [code, name, hostName, playerCount, maxPlayers, roundCount, roundDuration, status]
      properties:
        code:
          type: string
        name:
          type: string
        hostName:
          type: string
        playerCount:
          type: integer
        maxPlayers:
          type: integer
        roundCount:
          type: integer
        roundDuration:
          type: integer
        status:
          type: string
          enum: [waiting, playing]
    Logo:
      type: object
      required: [id, answer, aliases, category, difficulty, imageUrl, colors, glyph]
      properties:
        id:
          type: string
        answer:
          type: string
        aliases:
          type: array
          items:
            type: string
        category:
          type: string
        difficulty:
          type: string
          enum: [easy, medium, hard]
        imageUrl:
          type: string
        colors:
          type: array
          items:
            type: string
        glyph:
          type: string